name: 'Calmfox Watch accessibility check'
description: 'Checks your website for digital accessibility (WCAG) after a deployment and fails the build when the score drops below a threshold.'
author: 'Calmfox'
branding:
  icon: 'eye'
  color: 'orange'

inputs:
  token:
    description: 'Site token from the Calmfox Watch panel (Integrations → Releases). Keep it in secrets.'
    required: true
  secret:
    description: 'Release webhook secret (the same as CALMFOX_WATCH_SECRET). Keep it in secrets.'
    required: true
  threshold:
    description: 'Minimum score, 0–100, for the check to pass.'
    required: false
    default: '80'
  level:
    description: 'WCAG level the rules count up to: A or AA.'
    required: false
    default: 'AA'
  urls:
    description: 'Paths to check (up to 10), separated by spaces, commas or new lines. Empty = the addresses of the site check in the panel.'
    required: false
    default: ''
  timeout:
    description: 'Maximum number of seconds to wait for the result.'
    required: false
    default: '300'
  fail-on-error:
    description: 'Whether to fail the build when the check could not run (rate limit, outage, timeout).'
    required: false
    default: 'true'
  api-url:
    description: 'Calmfox Watch address.'
    required: false
    default: 'https://watch.calmfox.net'

outputs:
  score:
    description: 'Accessibility score, 0–100, on the checked addresses.'
  passed:
    description: 'true when the score is at least the threshold and there are no new critical issues.'
  report-url:
    description: 'Link to the digital accessibility screen in the panel.'
  check-id:
    description: 'Check identifier.'

runs:
  using: 'node20'
  main: 'index.js'
